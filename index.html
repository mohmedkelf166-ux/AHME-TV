
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AHMED TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>
  :root{
    --bg:#05070d; --bg-2:#0a0e1a; --card:#12172a; --card-2:#1a2138;
    --primary:#7c3aed; --secondary:#9333ea; --accent:#a855f7;
    --text:#f5f6fa; --text-dim:#9aa3ba; --text-mute:#5d6480;
    --gold:#e0b64f;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text); overflow-x:hidden;
    min-height:100vh;
  }
  ::-webkit-scrollbar{height:6px;width:6px}
  ::-webkit-scrollbar-thumb{background:var(--card-2);border-radius:10px}
  ::-webkit-scrollbar-track{background:transparent}

  h1,h2,h3,.display{font-family:'Tajawal',sans-serif}

  
  #loader{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .5s ease;
  }
  .reel{
    width:56px;height:56px;border-radius:50%;
    border:3px solid var(--card-2); border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{color:var(--text-mute);font-size:14px;font-weight:600;letter-spacing:.3px}


  header.topbar{
    position:fixed;top:0;left:0;right:0;z-index:200;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 5vw;
    background:linear-gradient(180deg, rgba(5,7,13,.92) 0%, rgba(5,7,13,0) 100%);
    transition:background .3s ease;
  }
  header.topbar.scrolled{ background:rgba(5,7,13,.85); backdrop-filter:blur(16px); box-shadow:0 2px 20px rgba(0,0,0,.35); }
  .brand{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .brand .mark{
    width:38px;height:38px;border-radius:9px;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
    box-shadow:0 4px 16px var(--primary)55;
  }
  .brand .word{ font-family:'Tajawal',sans-serif; font-weight:900; font-size:19px; letter-spacing:.5px; }
  .brand .word span{ color:var(--accent); }

  nav.topnav{ display:flex; gap:28px; }
  nav.topnav a{
    color:var(--text-dim); text-decoration:none; font-size:14.5px; font-weight:600;
    cursor:pointer; position:relative; padding:4px 0; transition:color .2s;
  }
  nav.topnav a.active, nav.topnav a:hover{ color:var(--text); }
  nav.topnav a.active::after{
    content:''; position:absolute; bottom:-6px; right:0; left:0; height:2px;
    background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:2px;
  }

  .top-actions{ display:flex; align-items:center; gap:14px; }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.06); color:var(--text); cursor:pointer; font-size:14px;
    border:1px solid rgba(255,255,255,.08); transition:all .2s;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.12); }

  .search-wrap{ position:relative; display:flex; align-items:center; }
  .search-wrap input{
    width:0; opacity:0; padding:0; border:none; outline:none;
    background:rgba(255,255,255,.07); color:#fff; border-radius:20px; font-size:13.5px;
    transition:width .3s ease, opacity .3s ease, padding .3s ease;
  }
  .search-wrap.open input{ width:200px; opacity:1; padding:9px 16px; }
  .search-wrap i{ cursor:pointer; }

  
  .hero{ position:relative; width:100%; height:88vh; min-height:520px; overflow:hidden; }
  .hero-slide{
    position:absolute; inset:0; opacity:0; transform:scale(1.04);
    background-size:cover; background-position:center top;
    transition:opacity 1.1s ease, transform 8s ease;
  }
  .hero-slide.active{ opacity:1; transform:scale(1); }
  .hero-slide::before{
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(5,7,13,.97) 0%, rgba(5,7,13,.55) 42%, rgba(5,7,13,.05) 70%),
      linear-gradient(0deg, var(--bg) 0%, transparent 32%, transparent 100%);
  }
  .hero-inner{
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:0 5vw 8vh; max-width:640px;
  }
  .hero-kicker{
    display:inline-flex; align-items:center; gap:8px; width:fit-content;
    color:var(--gold); font-size:13px; font-weight:700; margin-bottom:14px;
  }
  .hero-kicker i{ font-size:11px; }
  .hero-title{
    font-size:clamp(32px,5.5vw,58px); font-weight:900; line-height:1.12; color:#fff;
    text-shadow:0 4px 30px rgba(0,0,0,.5); margin-bottom:16px;
  }
  .hero-desc{
    font-size:15px; color:var(--text-dim); line-height:1.9; margin-bottom:26px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .hero-actions{ display:flex; gap:14px; }
  .btn{
    display:inline-flex; align-items:center; gap:10px; border:none; cursor:pointer;
    padding:14px 30px; border-radius:10px; font-size:15px; font-weight:700;
    font-family:'Cairo',sans-serif; transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn:active{ transform:scale(.96); }
  .btn-play{ background:#fff; color:#0a0e1a; }
  .btn-play:hover{ box-shadow:0 8px 24px rgba(255,255,255,.25); }
  .btn-ghost{ background:rgba(255,255,255,.1); color:#fff; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.15); }
  .btn-ghost:hover{ background:rgba(255,255,255,.18); }

  .hero-dots{ position:absolute; bottom:5vh; left:5vw; z-index:3; display:flex; gap:8px; }
  .hero-dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.25); cursor:pointer; transition:all .3s; }
  .hero-dot.active{ width:26px; border-radius:4px; background:var(--gold); }

  
  .rows-wrap{ position:relative; z-index:5; margin-top:-6vh; padding-bottom:80px; }
  .row-section{ margin-bottom:38px; }
  .row-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 5vw; margin-bottom:14px;
  }
  .row-title{ font-size:19px; font-weight:800; color:#fff; display:flex; align-items:center; gap:10px; }
  .row-title i{ color:var(--accent); font-size:16px; }
  .row-more{ font-size:13px; color:var(--text-mute); font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px; transition:color .2s; }
  .row-more:hover{ color:var(--text-dim); }

  .row-scroll{
    display:flex; gap:14px; overflow-x:auto; padding:4px 5vw 10px;
    scroll-snap-type:x proximity;
  }
  .row-scroll::-webkit-scrollbar{ display:none; }

  .poster-card{
    position:relative; flex:0 0 auto; width:160px; cursor:pointer; scroll-snap-align:start;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), z-index 0s;
  }
  .poster-card:hover{ transform:translateY(-8px) scale(1.04); z-index:10; }
  .poster-frame{
    width:100%; aspect-ratio:2/3; border-radius:10px; overflow:hidden; position:relative;
    background:linear-gradient(135deg,var(--card),var(--card-2));
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .poster-frame img{ width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .4s; }
  .poster-frame img.loaded{ opacity:1; }
  .poster-frame::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,.85) 0%, transparent 45%);
    opacity:0; transition:opacity .25s;
  }
  .poster-card:hover .poster-frame::after{ opacity:1; }
  .poster-play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .25s;
  }
  .poster-card:hover .poster-play{ opacity:1; }
  .poster-play i{
    width:42px;height:42px;border-radius:50%; background:rgba(255,255,255,.92); color:#0a0e1a;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .poster-rating{
    position:absolute; top:8px; right:8px; z-index:2;
    background:rgba(0,0,0,.55); backdrop-filter:blur(4px); color:var(--gold);
    font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:6px;
    display:flex; align-items:center; gap:4px;
  }
  .poster-live{
    position:absolute; top:8px; right:8px; z-index:2;
    background:linear-gradient(135deg,#dc2626,#ef4444); color:#fff;
    font-size:9.5px; font-weight:800; padding:3px 9px; border-radius:5px;
    display:flex; align-items:center; gap:5px;
  }
  .poster-live::before{ content:''; width:6px;height:6px;border-radius:50%;background:#fff; animation:blink 1.4s infinite; }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .poster-fav{
    position:absolute; top:8px; left:8px; z-index:2; width:30px;height:30px; border-radius:50%;
    background:rgba(0,0,0,.55); backdrop-filter:blur(4px); border:none; color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px;
  }
  .poster-fav.active{ color:#ef4444; }
  .poster-title{
    margin-top:9px; font-size:13px; font-weight:700; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  
  .chan-card{
    flex:0 0 auto; width:150px; cursor:pointer; scroll-snap-align:start;
    background:linear-gradient(155deg,var(--card),var(--card-2)); border-radius:14px;
    padding:16px 12px; text-align:center; border:1px solid rgba(255,255,255,.05);
    transition:all .25s; position:relative;
  }
  .chan-card:hover{ border-color:var(--accent)55; transform:translateY(-5px); }
  .chan-card img{ width:100%; max-height:42px; object-fit:contain; margin-bottom:12px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.3)); }
  .chan-card .name{ font-size:12.5px; font-weight:700; color:#e7e9f2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chan-live-badge{ position:absolute; top:10px; left:10px; background:#dc2626; color:#fff; font-size:8.5px; font-weight:800; padding:3px 7px; border-radius:4px; }

  
  .pill-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 5vw 16px; }
  .pill-row::-webkit-scrollbar{ display:none; }
  .pill{
    flex:0 0 auto; padding:8px 20px; border-radius:20px; font-size:12.5px; font-weight:700;
    color:var(--text-dim); background:var(--card); border:1px solid rgba(255,255,255,.06); cursor:pointer;
    transition:all .2s;
  }
  .pill.active{ background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; border-color:transparent; }


  .page{ display:none; padding:130px 5vw 80px; min-height:100vh; }
  .page.active{ display:block; }
  .page-title{ font-size:24px; font-weight:900; margin-bottom:6px; }
  .page-sub{ color:var(--text-mute); font-size:13.5px; margin-bottom:24px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px 14px; }
  .empty{ text-align:center; padding:100px 20px; color:var(--text-mute); }
  .empty i{ font-size:52px; margin-bottom:18px; color:var(--card-2); }
  .empty p{ font-size:15px; font-weight:700; color:var(--text-dim); }

  
  .chan-list{ display:flex; flex-direction:column; gap:10px; }
  .chan-row{
    display:flex; align-items:center; gap:14px; background:var(--card); border-radius:14px;
    padding:12px 16px; cursor:pointer; border:1px solid rgba(255,255,255,.05); transition:all .2s;
  }
  .chan-row:hover{ border-color:var(--accent)40; }
  .chan-row .logo{ width:50px;height:50px;border-radius:12px;background:#0d1220; display:flex;align-items:center;justify-content:center; overflow:hidden; flex-shrink:0; }
  .chan-row .logo img{ max-width:38px;max-height:30px;object-fit:contain; }
  .chan-row .meta{ flex:1; min-width:0; }
  .chan-row .meta .n{ font-size:14px; font-weight:700; color:#fff; white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .chan-row .meta .l{ font-size:11px; color:#ef4444; font-weight:700; display:flex; align-items:center; gap:5px; margin-top:4px; }
  .chan-row .meta .l::before{ content:'';width:6px;height:6px;border-radius:50%;background:#ef4444;animation:blink 1.4s infinite; }
  .chan-row .play{ width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0; }


  .player-modal{ position:fixed; inset:0; background:#000; z-index:1000; display:none; flex-direction:column; }
  .player-modal.active{ display:flex; }
  .player-top{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:linear-gradient(180deg,rgba(0,0,0,.8),transparent); position:absolute; top:0; left:0; right:0; z-index:2; }
  .player-top .t{ font-size:15px; font-weight:700; color:#fff; white-space:nowrap;overflow:hidden;text-overflow:ellipsis; max-width:70%; }
  .player-close{ width:38px;height:38px;border-radius:50%; background:rgba(255,255,255,.12); display:flex;align-items:center;justify-content:center; color:#fff; cursor:pointer; font-size:16px; }
  video{ width:100%; height:100%; object-fit:contain; background:#000; }

  
  .series-hero{ width:100%; height:52vh; min-height:340px; position:relative; background-size:cover; background-position:center; border-radius:16px; overflow:hidden; margin-bottom:24px; }
  .series-hero::after{ content:''; position:absolute; inset:0; background:linear-gradient(0deg,var(--bg) 5%,transparent 55%),linear-gradient(90deg,rgba(5,7,13,.85),transparent 60%); }
  .series-hero-content{ position:absolute; bottom:24px; right:24px; left:24px; z-index:2; }
  .series-hero-content h2{ font-size:clamp(24px,4vw,38px); color:#fff; margin-bottom:8px; }
  .genre-badge{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.1); backdrop-filter:blur(8px); padding:5px 14px; border-radius:16px; font-size:12px; color:var(--gold); font-weight:700; }
  .series-plot{ color:var(--text-dim); font-size:14px; line-height:1.9; margin-bottom:26px; max-width:720px; }
  .season-label{ font-size:14px; font-weight:800; color:var(--accent); padding:16px 0 10px; }
  .ep-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:10px; cursor:pointer; border:1px solid rgba(255,255,255,.05); transition:all .2s; }
  .ep-row:hover{ border-color:var(--accent)40; transform:translateX(-4px); }
  .ep-row .name{ font-size:14px; font-weight:700; color:#fff; }
  .ep-row .sub{ font-size:11.5px; color:var(--text-mute); margin-top:4px; }
  .ep-row i{ color:var(--accent); font-size:16px; background:var(--accent)18; padding:12px; border-radius:50%; }

  
  .theme-panel{ position:fixed; top:70px; left:5vw; background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px; z-index:250; display:none; box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .theme-panel.active{ display:block; animation:popIn .2s ease; }
  @keyframes popIn{ from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .theme-panel-title{ font-size:12px; color:var(--text-mute); font-weight:700; margin-bottom:12px; }
  .theme-swatches{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .swatch{ width:36px;height:36px;border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .2s; position:relative; }
  .swatch.active{ border-color:#fff; transform:scale(1.1); }

  .toast-host{ position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:3000; }
  .toast{
    background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; padding:13px 26px;
    border-radius:30px; font-size:13.5px; font-weight:700; box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:9px; animation:toastIn .3s ease, toastOut .3s ease 2.2s forwards;
  }
  @keyframes toastIn{ from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut{ to{opacity:0;transform:translateY(-12px)} }

  footer{ padding:40px 5vw; text-align:center; color:var(--text-mute); font-size:12.5px; border-top:1px solid rgba(255,255,255,.05); }

  @media(max-width:720px){
    nav.topnav{ display:none; }
    .search-wrap.open input{ width:130px; }
    .poster-card{ width:120px; }
    .chan-card{ width:120px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="reel"></div>
  <p>جاري تجهيز الصالة...</p>
</div>

<header class="topbar" id="topbar">
  <div class="brand" onclick="goHome()">
    <div class="mark"><i class="fa-solid fa-clapperboard"></i></div>
    <div class="word">AHMED <span>TV</span></div>
  </div>
  <nav class="topnav">
    <a class="active" data-page="home" onclick="showPage('home')">الرئيسية</a>
    <a data-page="live" onclick="showPage('live')">مباشر</a>
    <a data-page="movies" onclick="showPage('movies')">أفلام</a>
    <a data-page="series" onclick="showPage('series')">مسلسلات</a>
    <a data-page="favorites" onclick="showPage('favorites')">قائمتي</a>
  </nav>
  <div class="top-actions">
    <div class="search-wrap" id="searchWrap">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم، مسلسل، قناة..." oninput="onSearch()">
      <div class="icon-btn" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></div>
    </div>
    <div class="icon-btn" onclick="toggleThemePanel()"><i class="fa-solid fa-palette"></i></div>
  </div>
</header>

<div class="theme-panel" id="themePanel">
  <div class="theme-panel-title">اختر لون الواجهة</div>
  <div class="theme-swatches" id="themeSwatches"></div>
</div>


<div class="page active" id="page-home" style="padding:0;">
  <section class="hero" id="hero">
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <div class="rows-wrap" id="homeRows"></div>
</div>


<div class="page" id="page-live">
  <div class="page-title">البث المباشر</div>
  <div class="page-sub">تابع قنواتك المفضلة أونلاين</div>
  <div class="pill-row" id="liveFilters"></div>
  <div class="chan-list" id="liveGrid"></div>
</div>


<div class="page" id="page-movies">
  <div class="page-title">الأفلام</div>
  <div class="page-sub">أحدث وأفضل الأفلام</div>
  <div class="pill-row" id="moviesFilters"></div>
  <div class="grid" id="moviesGrid"></div>
</div>


<div class="page" id="page-series">
  <div class="page-title">المسلسلات</div>
  <div class="page-sub">مواسم وحلقات كاملة</div>
  <div class="pill-row" id="seriesFilters"></div>
  <div class="grid" id="seriesGrid"></div>
</div>


<div class="page" id="page-favorites">
  <div class="page-title">قائمتي</div>
  <div class="page-sub">المحتوى المفضل لديك</div>
  <div class="grid" id="favoritesGrid"></div>
</div>


<div class="page" id="page-search">
  <div class="page-title">نتائج البحث</div>
  <div class="page-sub" id="searchSub"></div>
  <div class="grid" id="searchGrid"></div>
</div>


<div class="page" id="page-seriesDetail">
  <div id="seriesDetailContent"></div>
</div>

<div class="player-modal" id="playerModal">
  <div class="player-top">
    <div class="t" id="playerTitle"></div>
    <div class="player-close" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></div>
  </div>
  <video id="videoEl" controls autoplay playsinline></video>
</div>

<div class="toast-host" id="toastHost"></div>

<footer>AHMED TV — منصة مشاهدة خاصة. جميع الحقوق محفوظة.</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="app.js"></script>
<script>
  
  window.__startApp();
</script>
</body>
</html>
